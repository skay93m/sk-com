<!-- Alex Hyett Style Navigation -->
<header class="alex-nav-header">
    <nav class="alex-nav">
        <div class="alex-nav-container">
            <!-- Logo/Brand -->
            <a class="alex-nav-brand" href="{% url 'home' %}">
                SYAFIQ KAY
            </a>
            
            <!-- Mobile menu button -->
            <button class="alex-nav-toggle" type="button" data-bs-toggle="collapse" data-bs-target="#alexNavbar"
                aria-controls="alexNavbar" aria-expanded="false" aria-label="Toggle navigation">
                <span class="alex-nav-toggle-icon"></span>
                <span class="alex-nav-toggle-icon"></span>
                <span class="alex-nav-toggle-icon"></span>
            </button>
            
            <!-- Navigation Links -->
            <div class="collapse navbar-collapse" id="alexNavbar">
                <ul class="alex-nav-links">
                    <li class="alex-nav-item">
                        <a class="alex-nav-link" href="{% url 'cv:cv_main' %}">CV</a>
                    </li>
                    <li class="alex-nav-item">
                        <a class="alex-nav-link" href="{% url 'projects:project_list' %}">PORTFOLIO</a>
                    </li>
                    <li class="alex-nav-item">
                        <a class="alex-nav-link" href="{% url 'writing:writing_list' %}">ARTICLES</a>
                    </li>
                    <li class="alex-nav-item">
                        <a class="alex-nav-link" href="{% url 'mcq:landing' %}">MCQ</a>
                    </li>
                    {% if user.is_authenticated %}
                    <li class="alex-nav-item">
                        <a class="alex-nav-link" href="{% url 'analytics:dashboard' %}">ANALYTICS</a>
                    </li>
                    <li class="alex-nav-item">
                        <a class="alex-nav-link alex-nav-admin" href="{% url 'hero_list' %}">
                            ADMIN
                        </a>
                    </li>
                    {% endif %}
                </ul>
                
                <!-- Auth section -->
                <div class="alex-nav-auth">
                    {% if user.is_authenticated %}
                        <span class="alex-nav-user">
                            {{ user.username }}
                        </span>
                        <a href="{% url 'secure_admin_logout' %}" class="alex-nav-logout">Logout</a>
                    {% else %}
                        <a href="{% url 'secure_admin_login' %}" class="alex-nav-login">Login</a>
                    {% endif %}
                </div>
            </div>
        </div>
    </nav>
</header>
