{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}{{ title }}{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {% load bootstrap5 %}
    {% bootstrap_css %}
    {% bootstrap_javascript %}
    <link rel="stylesheet" href="{% static 'css/fonts.css' %}">
    <link rel="stylesheet" href="{% static 'css/colours.css' %}">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">
    <header class="container mt-2 mb-2">
        <nav class="navbar navbar-expand-lg navbar-light bg-light">
            <div class="container-fluid">
                <a class="navbar-brand" href="#">Home</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                    aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item">
                            <a class="nav-link" href="#projects">Projects</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#writing">Writing</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'admin:index' %}">Admin</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>
    <main class="mt-2 mt-2 p-5 flex-grow-1">
        <div class="container">
            {% block content %}{% endblock %}
        </div>
    </main>
    <footer class="footer mt-auto py-3 ">
        <div class="container text-center">
            <p class="small">
                <a href="mailto:syafiq@syafiqkay.com" title="Email">
                    <i class="bi bi-envelope"></i> Contact
                </a> |
                <a href="https://www.linkedin.com/in/syafiqkay92/" target="_blank" title="LinkedIn">
                    <i class="bi bi-linkedin"></i> LinkedIn
                </a> |
                <a href="https://github.com/skay93m" target="_blank" title="GitHub">
                    <i class="bi bi-github"></i> GitHub
                </a>
            </p>
            <p class="small">
                <i class="bi bi-c-circle"></i> {% now "Y" %} Syafiq Kay Ltd. All rights reserved.
            </p>
        </div>
        <!-- Bootstrap Icons CDN -->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    </footer>
</body>
</html>
