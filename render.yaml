services:
  - type: web
    name: sk-website
    env: python
    plan: starter
    buildCommand: "pip install uv && uv sync && uv run python manage.py migrate && uv run python manage.py collectstatic --noinput"
    startCommand: "uv run gunicorn syafiqkay.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "sk-website.onrender.com,syafiqkay.com,www.syafiqkay.com"
      - key: SECURE_SSL_REDIRECT
        value: "True"
      - key: SECURE_HSTS_SECONDS
        value: "31536000"
      - key: SECURE_HSTS_INCLUDE_SUBDOMAINS
        value: "True"
      - key: SECURE_HSTS_PRELOAD
        value: "True"
      - key: SESSION_COOKIE_SECURE
        value: "True"
      - key: CSRF_COOKIE_SECURE
        value: "True"
      - key: WHITENOISE_USE_FINDERS
        value: "False"
      - key: WHITENOISE_AUTOREFRESH
        value: "False"
