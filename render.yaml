databases:
  - name: sk-website-db
    databaseName: sk_website
    user: sk_user
    plan: free

services:
  - type: web
    name: sk-website
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python manage.py migrate && python manage.py collectstatic --noinput"
    startCommand: "gunicorn sk.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "sk-website.onrender.com,syafiqkay.com,www.syafiqkay.com"
      - key: DATABASE_URL
        fromDatabase:
          name: sk-website-db
          property: connectionString
      - key: SECURE_SSL_REDIRECT
        value: "True"
      - key: SECURE_HSTS_SECONDS
        value: "31536000"
      - key: SECURE_HSTS_INCLUDE_SUBDOMAINS
        value: "True"
      - key: SECURE_HSTS_PRELOAD
        value: "True"
      - key: SESSION_COOKIE_SECURE
        value: "True"
      - key: CSRF_COOKIE_SECURE
        value: "True"
      - key: WHITENOISE_USE_FINDERS
        value: "False"
      - key: WHITENOISE_AUTOREFRESH
        value: "False"
