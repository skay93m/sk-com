# Proposed static-site deployment. The dashboard remains authoritative until
# this Blueprint is adopted. Disable previews on the existing service there too.
# Django retains HTTP 302 for all legacy routes (/cv/, /labs/, /about/, /writing/).
# On Render Static Sites, permanently retired /cv, /labs, and /writing use edge
# redirect rules (301) alongside meta-refresh fallbacks, while planned Stage 2
# /about uses a rewrite to its meta-refresh fallback HTML to avoid 301 caching.
previews:
  generation: "off"
services:
  - type: web
    name: syafiqkay.com
    runtime: static
    branch: main
    buildCommand: pip install --upgrade pip && pip install uv==0.11.32 && uv sync --frozen --no-dev && uv run --frozen --no-dev python manage.py export_static
    staticPublishPath: dist
    previews:
      generation: "off"
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
    routes:
      - type: redirect
        source: /cv
        destination: /
      - type: redirect
        source: /cv/
        destination: /
      - type: redirect
        source: /labs
        destination: /
      - type: redirect
        source: /labs/
        destination: /
      - type: redirect
        source: /writing
        destination: /
      - type: redirect
        source: /writing/
        destination: /
      - type: rewrite
        source: /about
        destination: /about/index.html
      - type: rewrite
        source: /about/*
        destination: /about/index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
