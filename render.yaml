# Proposed static-site deployment. The dashboard remains authoritative until
# this Blueprint is adopted. Disable previews on the existing service there too.
# Render static edge redirect rules return 301; Django retains HTTP 302s and
# export_static emits meta-refresh fallback HTML for legacy paths.
previews:
  generation: "off"
services:
  - type: web
    name: syafiqkay.com
    runtime: static
    branch: main
    buildCommand: uv sync --frozen --no-dev && uv run --frozen --no-dev python manage.py export_static
    staticPublishPath: dist
    previews:
      generation: "off"
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
    routes:
      - type: redirect
        source: /cv/
        destination: /
      - type: redirect
        source: /labs/
        destination: /
      - type: redirect
        source: /about/
        destination: /
      - type: redirect
        source: /writing/
        destination: /
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
