# Proposed static-site deployment. The Render dashboard remains authoritative.
# Rewrite legacy paths to refresh pages because edge redirects are permanent.
previews:
  generation: "off"
services:
  - type: web
    name: syafiqkay.com
    runtime: static
    branch: main
    buildCommand: pip install --upgrade pip && pip install uv==0.11.32 && uv sync --frozen --no-dev && uv run --frozen --no-dev python manage.py export_static
    staticPublishPath: dist
    previews:
      generation: "off"
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
    routes:
      - type: rewrite
        source: /cv
        destination: /cv/index.html
      - type: rewrite
        source: /cv/*
        destination: /cv/index.html
      - type: rewrite
        source: /labs
        destination: /labs/index.html
      - type: rewrite
        source: /labs/*
        destination: /labs/index.html
      - type: rewrite
        source: /about
        destination: /about/index.html
      - type: rewrite
        source: /about/*
        destination: /about/index.html
      - type: rewrite
        source: /writing
        destination: /writing/index.html
      - type: rewrite
        source: /writing/*
        destination: /writing/index.html
      - type: rewrite
        source: /writings
        destination: /writings/index.html
      - type: rewrite
        source: /writings/*
        destination: /writings/index.html
      - type: rewrite
        source: /notes
        destination: /notes/index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
