[project]
name = "sk-website"
version = "6.0.0"
description = "This is the source code for my personal website."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "django>=5.2.4",
    "gunicorn>=20.1.0",
    "markdown>=3.10.2",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    "whitenoise>=6.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "pytest-django>=4.11.1",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "syafiqkay.settings"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
