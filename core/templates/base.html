<!DOCTYPE html>
{% load static %}
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Syafiq Kay{% endblock %}</title>
  <meta name="description" content="{% block description %}{{ bio.tagline }}{% endblock %}">
  {% block meta %}{% endblock %}
  <link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body>
  <header class="site-header">
    <div class="page-frame site-header-inner">
      <a class="site-mark" href="{% url 'core:home' %}">Syafiq Kay</a>
      <nav class="site-nav" aria-label="Main navigation">
        <a href="{% url 'core:home' %}"{% if request.resolver_match.url_name == 'home' %} aria-current="page"{% endif %}>Home</a>
        <a href="{% url 'core:writings' %}"{% if request.resolver_match.url_name == 'writings' or request.resolver_match.url_name == 'post-detail' %} aria-current="page"{% endif %}>Writing</a>
        <a href="{% url 'core:labs' %}"{% if request.resolver_match.url_name == 'labs' or request.resolver_match.url_name == 'lab-detail' %} aria-current="page"{% endif %}>Labs</a>
        <a href="{% url 'core:cv' %}"{% if request.resolver_match.url_name == 'cv' %} aria-current="page"{% endif %}>CV</a>
      </nav>
    </div>
  </header>

  <main class="page-frame page-content">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="page-frame">
      <p>&copy; {% now "Y" %} Syafiq Kay</p>
      <p>This site is <a href="https://github.com/skay93m/sk-com" target="_blank" rel="noopener">open source</a>. I build in public, and I am always open to being corrected.</p>
    </div>
  </footer>
</body>
</html>
