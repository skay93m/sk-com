<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Syafiq Kay{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
  <style>
    .social-links a { color: #6c757d; }
    .social-links a:hover { color: #212529; }
    .social-links svg { width: 1.25rem; height: 1.25rem; }
    .cv-entry-header { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; }
    .cv-entry-meta { white-space: nowrap; }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-sm mb-5">
    <div class="container" style="max-width: 720px;">
      <a class="navbar-brand fw-normal" href="{% url 'core:home' %}">Home</a>
      <div class="navbar-nav ms-auto">
        <a class="nav-link" href="{% url 'core:writings' %}">Writings</a>
        <a class="nav-link" href="{% url 'core:cv' %}">CV</a>
      </div>
    </div>
  </nav>
  <main class="container mb-5" style="max-width: 720px;">
    {% block content %}{% endblock %}
  </main>
  <footer class="mt-5 py-4">
    <div class="container text-muted small" style="max-width: 720px;">
      &copy; {% now "Y" %} Syafiq Kay
    </div>
  </footer>
</body>
</html>
