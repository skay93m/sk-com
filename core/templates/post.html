{% extends "base.html" %}
{% block title %}{{ post.title }} — Syafiq Kay{% endblock %}
{% block content %}
<article>
  <header class="mb-4">
    <h1 class="fw-normal">{{ post.title }}</h1>
    <time class="text-muted small" datetime="{{ post.date|date:'Y-m-d' }}">{{ post.date|date:"d F Y" }}</time>
  </header>
  <div>
    {{ post.body_html|safe }}
  </div>
</article>
<p class="mt-4"><a href="{% url 'core:writings' %}" class="text-muted text-decoration-none">← All writings</a></p>
{% endblock %}
